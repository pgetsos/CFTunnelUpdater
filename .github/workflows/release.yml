name: Release APK (manual)
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name (for example 0.5.0)
        required: true
        type: string
      version_code:
        description: Version code (integer greater than the previous release)
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: release-apk
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: ${{ inputs.version }}
      VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release inputs
        shell: bash
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || exit 1
          test "$VERSION_CODE" -le 2100000000
          if gh release view "v$VERSION_NAME" >/dev/null 2>&1; then
            echo "Release already exists"; exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Test and build signed release
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          node --test tests/worker.test.mjs
          ./gradlew testDebugUnitTest lintRelease assembleRelease -PreleaseVersionName="$VERSION_NAME" -PreleaseVersionCode="$VERSION_CODE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "CFTunnelUpdater-$VERSION_NAME.apk"
          sha256sum "CFTunnelUpdater-$VERSION_NAME.apk" > SHA256SUMS.txt
      - name: Create draft release for manual publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION_NAME" "CFTunnelUpdater-$VERSION_NAME.apk" SHA256SUMS.txt --target "$GITHUB_SHA" --title "CFTunnelUpdater $VERSION_NAME" --draft --generate-notes
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
